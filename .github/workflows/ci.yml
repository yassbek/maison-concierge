name: Maison CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: maison-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  CRM_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Types, concierge tests, and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maison_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maison_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maison_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maison_test?schema=public
      BETTER_AUTH_SECRET: ci-only-fictional-auth-secret-not-for-deployment
      ALLOWED_SIGN_IN: maison.example
      APP_URL: http://127.0.0.1:3107
      API_URL: http://127.0.0.1:3108
      CONCIERGE_LOCAL_DEMO: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Apply migrations to isolated CI database
        run: bun run db:deploy
      - name: Check all workspace types
        run: bun run check-types
      - name: Test concierge API against PostgreSQL
        working-directory: apps/api
        run: bun test --preload ./test/setup.ts src/concierge/concierge.spec.ts
      - name: Test intake evidence and queue handling
        run: bun test apps/agent/test/concierge-intake.spec.ts apps/agent/test/concierge-queue.spec.ts
      - name: Test private preview authorization
        run: bun test apps/app/lib/concierge-preview-auth.test.ts
      - name: Build Next.js production application
        run: bun run --cwd apps/app build
